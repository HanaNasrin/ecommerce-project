{% extends 'base.html' %}

{% block content %}

<style>

.checkout-container{
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.checkout-title{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.checkout-form p{
    margin-bottom:18px;
}

.checkout-form label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#444;
}

.checkout-form input,
.checkout-form textarea,
.checkout-form select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

.checkout-form textarea{
    resize:vertical;
    min-height:100px;
}

.payment-btn{
    width:100%;
    background:#28a745;
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.payment-btn:hover{
    background:#218838;
}

.checkout-note{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:14px;
}

</style>

<div class="checkout-container">

    <h2 class="checkout-title">
        Checkout
    </h2>

    <form method="POST" class="checkout-form">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="payment-btn">
            Proceed to Payment
        </button>

    </form>

    <p class="checkout-note">
        Please verify your shipping details before continuing to payment.
    </p>

</div>

{% endblock %}
