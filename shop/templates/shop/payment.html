{% extends 'base.html' %}

{% block content %}

<div style="max-width:700px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);">

    <h2 style="text-align:center;">
        Payment
    </h2>

    <hr>

    <h3>Order Summary</h3>

    <table width="100%" cellpadding="10">

        <tr>
            <th align="left">Product</th>
            <th>Qty</th>
            <th align="right">Price</th>
        </tr>

        {% for item in products %}

        <tr>

            <td>{{ item.product.name }}</td>

            <td align="center">
                {{ item.quantity }}
            </td>

            <td align="right">
                ₹ {{ item.subtotal }}
            </td>

        </tr>

        {% endfor %}

    </table>

    <hr>

    <h2 style="text-align:right;">
        Total : ₹ {{ total }}
    </h2>

    <br>

    <div style="text-align:center;">

        <button
        style="
        background:#28a745;
        color:white;
        padding:12px 30px;
        border:none;
        border-radius:6px;
        font-size:18px;
        cursor:pointer;">

            Pay Now

        </button>

    </div>

    <br>

    <p style="text-align:center;color:gray;">

        Sandbox Payment Mode

    </p>

</div>

{% endblock %}
