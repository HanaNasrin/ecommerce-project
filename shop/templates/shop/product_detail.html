{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2>{{ product.name }}</h2>

    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" width="300">
    {% else %}
        <p>No image available</p>
    {% endif %}

    <p>{{ product.description }}</p>

    <h3>₹ {{ product.price }}</h3>

    <br>

    <a href="{% url 'add_to_cart' product.id %}"
    class="btn btn-success">

    Add To Cart

    </a>

    <a href="{% url 'products' %}" class="btn btn-secondary">
        Back to Products
    </a>

</div>

{% endblock %}
